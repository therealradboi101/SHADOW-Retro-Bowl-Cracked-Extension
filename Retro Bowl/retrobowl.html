<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>S.H.A.D.O.W - Loading Retro Bowl</title>
    <style>
        body {
            background: #000;
            color: #00ffff;
            font-family: 'Courier New', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            background: rgba(0, 0, 0, 0.8);
            padding: 30px;
            border-radius: 15px;
            border: 2px solid #00ffff;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.5);
        }
        h1 {
            color: #ff00ff;
            margin-bottom: 20px;
        }
        .loading {
            color: #ffff00;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔮 S.H.A.D.O.W</h1>
        <p>Loading Retro Bowl with S.H.A.D.O.W mods...</p>
        <p class="loading">The S.H.A.D.O.W control bar will appear automatically.</p>
        <p>If nothing happens, <a href="https://blobby-boi.github.io/retro-bowl/" style="color: #00ff00;">click here</a></p>
    </div>

    <script>
        // Simple redirect - no inline JavaScript issues
        setTimeout(function() {
            window.location.href = 'https://blobby-boi.github.io/retro-bowl/';
        }, 2000);
    </script>
</body>
</html>
